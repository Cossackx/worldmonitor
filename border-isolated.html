<!doctype html><html><head><title>Border alignment diagnostic</title><style>body{margin:0}#map{width:100vw;height:100vh}</style></head><body><div id="map"></div><script type="module">
import Globe from 'globe.gl';
import {normalizeGlobePolygonRings} from './src/utils/globe-polygon-winding.ts';
const globe=new Globe(document.getElementById('map')).width(innerWidth).height(innerHeight).globeImageUrl('/textures/earth-topo-bathy.jpg').backgroundColor('#111').showAtmosphere(false);
globe.controls().autoRotate=false;
const d=await fetch('/data/countries.geojson').then(r=>r.json());const f=d.features.find(f=>f.properties['ISO3166-1-Alpha-2']==='IR');
globe.polygonGeoJsonGeometry(d=>d).polygonCapCurvatureResolution(1).polygonCapColor('rgba(255,0,0,0.25)').polygonSideColor('rgba(0,0,0,0)').polygonStrokeColor('red').polygonAltitude(0.006).polygonsData([{type:'Polygon',coordinates:normalizeGlobePolygonRings(f.geometry.coordinates)}]);
globe.pointOfView({lat:32,lng:53,altitude:0.7},0);window.borderDiagnosticGlobe=globe;
</script></body></html>
